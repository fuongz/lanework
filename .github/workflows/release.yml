# INF-09: a `v*` tag builds the macOS DMG, signed with the Developer ID,
# notarized and stapled (the app and the DMG), and attaches it with its
# .sha256 to a DRAFT GitHub Release. A maintainer reviews the draft and
# presses Publish.
#
# INF-11: the same build makes the update zip (the same notarized, stapled
# app), its blockmap and latest-mac.yml, which go on the draft too. Installed
# apps read latest-mac.yml from the latest PUBLISHED release, so nothing is
# offered to anyone until the maintainer presses Publish.
#
#   git tag v0.2.0 && git push origin v0.2.0   # tag == apps/desktop/package.json version
#
# Setup, once, in Settings > Environments > `release`:
#   - Required reviewers: the maintainer; deployment branches and tags: `v*`.
#     The Developer ID signs software in the maintainer's name, so no job
#     reaches these secrets without that approval.
#   - Secrets:
#       MAC_CERT_P12_BASE64  Developer ID Application certificate + private
#                            key, exported from Keychain Access as .p12,
#                            then `base64 -i cert.p12`
#       MAC_CERT_PASSWORD    the .p12's export password
#       APPLE_API_KEY_P8     contents of an App Store Connect API key
#                            (AuthKey_<id>.p8, role Developer), CI's own key
#       APPLE_API_KEY_ID     its Key ID
#       APPLE_API_ISSUER     the Issuer ID
#   - Variable:
#       LANEWORK_MAC_IDENTITY  "Name (TEAMID)", the certificate's name
#                              without "Developer ID Application: "
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: macos-latest
    environment: release
    # Signing timestamps every file, and notarization runs twice (app, DMG).
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match apps/desktop/package.json version $version"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # A throwaway keychain on the search list, so electron-builder and
      # codesign find the identity the way they do on a maintainer's Mac.
      - name: Import the Developer ID certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -sSfL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in MAC_CERT_P12_BASE64"; exit 1; }

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and notarize the DMG and update zip
        working-directory: apps/desktop
        env:
          LANEWORK_MAC_IDENTITY: ${{ vars.LANEWORK_MAC_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run dist -- --mac

      - name: Check the DMG
        working-directory: apps/desktop/release
        run: |
          for dmg in *.dmg; do
            spctl -a -t open --context context:primary-signature -vv "$dmg"
            xcrun stapler validate "$dmg"
            shasum -a 256 -c "$dmg.sha256"
          done

      # What Squirrel.Mac will install: latest-mac.yml must describe this zip
      # (name, version, sha512), and the app inside must pass Gatekeeper as
      # it is, signed, notarized and stapled.
      - name: Check the update zip
        working-directory: apps/desktop/release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          zips=(*-mac.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one *-mac.zip, found ${#zips[@]}"
            exit 1
          fi
          zip="${zips[0]}"
          [ -f "$zip.blockmap" ] || { echo "::error::No blockmap for $zip"; exit 1; }
          [ -f latest-mac.yml ] || { echo "::error::latest-mac.yml was not written"; exit 1; }
          grep -qx "version: ${TAG#v}" latest-mac.yml \
            || { echo "::error::latest-mac.yml is not for ${TAG#v}"; exit 1; }
          grep -qx "path: $zip" latest-mac.yml \
            || { echo "::error::latest-mac.yml does not name $zip"; exit 1; }
          want="$(sed -n 's/^sha512: //p' latest-mac.yml)"
          got="$(openssl dgst -sha512 -binary "$zip" | base64)"
          [ "$want" = "$got" ] \
            || { echo "::error::$zip does not match the sha512 in latest-mac.yml"; exit 1; }
          dir="$(mktemp -d "$RUNNER_TEMP/update-zip.XXXXXX")"
          ditto -x -k "$zip" "$dir"
          codesign --verify --deep --strict --verbose=2 "$dir/Lanework.app"
          spctl -a -t exec -vv "$dir/Lanework.app"
          xcrun stapler validate "$dir/Lanework.app"

      - name: Draft the GitHub Release
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Lanework ${TAG#v}" --generate-notes \
            ./*.dmg ./*.dmg.sha256 \
            ./*-mac.zip ./*-mac.zip.blockmap ./latest-mac.yml

      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
