appId: com.lanework.desktop
productName: Lanework
asar: true
directories:
  output: release
# INF-05 (SR-04): app.asar holds `files` (dist/ and package.json) plus the
# node_modules of every runtime `dependencies` entry in package.json, which
# electron-builder copies on top of `files`. So a package the renderer or main
# bundles goes in devDependencies (Vite or esbuild inlines it), and only a
# module main loads unbundled at run time is a dependency.
# - INF-11: electron-updater is the one runtime dependency. electron-builder
#   copies it and its own dependencies into app.asar/node_modules, and
#   electron/main/updater/index.ts requires that copy at run time (on a
#   packaged release build only), so esbuild never inlines it.
# - node-pty, which main also loads unbundled, stays a devDependency: its
#   native binary is staged into dist/ by scripts/electron-bundle.mjs.
files:
  - dist/electron/**/*
  - dist/client/**/*
  - package.json
# FE-19: node-pty's `.node` binary cannot be loaded from inside an asar, and
# its `spawn-helper` cannot be executed from one. Both are staged into
# dist/electron/node_modules by `scripts/electron-bundle.mjs`.
asarUnpack:
  - "**/node_modules/@lydell/**"
  # FE-28: the Stop hook is run by path from ~/.claude/settings.json under
  # ELECTRON_RUN_AS_NODE, a plain Node that is not asar-aware.
  - "dist/electron/hook/**"
  # FE-52: the offline MCP server, run the same way from ~/.lanew/bin/lanework-mcp.
  - "dist/electron/mcp-local/**"
  # FE-87: the lead's control CLI, run the same way from ~/.lanew/bin/lanework-control.
  - "dist/electron/control/**"
  # FE-69: the dictation helper is a native executable, spawned by path.
  - "dist/electron/bin/**"
# The pty binary is a prebuilt N-API module: it runs under Electron's Node as
# is, and there is nothing here for electron-rebuild to compile.
npmRebuild: false
# INF-05 (SW-01): Electron fuses, flipped in the binary at package time.
electronFuses:
  # Stays on: the Stop hook, the statusline, the offline MCP server and
  # lanework-control all run as `ELECTRON_RUN_AS_NODE=1 <Lanework> <script>`
  # from the agents' configs. Turning it off needs them moved off the app
  # binary first (out of scope for INF-05).
  runAsNode: true
  # NODE_OPTIONS / NODE_EXTRA_CA_CERTS would let any process that starts the
  # app preload code into it under Lanework's signature.
  enableNodeOptionsEnvironmentVariable: false
  # Off for release builds. `bun run package` overrides it back on
  # (electron-builder.package.yml), because test:packaged attaches over
  # --inspect.
  enableNodeCliInspectArguments: false
  # app.asar is checked against the hash electron-builder records in
  # Info.plist, and only app.asar is loaded: no loose app/ folder next to it.
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # The renderer is served from app://, never file://.
  grantFileProtocolExtraPrivileges: false
# INF-05 (SW-05): writes <name>.dmg.sha256 next to each DMG.
artifactBuildCompleted: ./scripts/dmg-checksum.mjs
# INF-09: on a release build (Developer ID + notarize credentials, which only
# `bun run dist` passes), signs, notarizes and staples each DMG, then
# rewrites its .sha256. Does nothing on any other build.
afterAllArtifactBuild: ./scripts/dmg-notarize.mjs
dmg:
  # INF-11: the updater installs from the zip, never the DMG. No update info
  # or blockmap for it: one written before the DMG is stapled would no longer
  # match it.
  writeUpdateInfo: false
# INF-11 (D1): where electron-updater looks for releases. electron-builder
# writes it into the app as Contents/Resources/app-update.yml, and writes
# latest-mac.yml (version, zip name, size, sha512) beside the zip. It never
# publishes: scripts/electron-builder.mjs always passes `--publish never`, and
# the release workflow uploads to a draft the maintainer publishes by hand.
# A draft is never offered: the updater reads only published releases.
publish:
  provider: github
  owner: fuongz
  repo: lanework
mac:
  icon: build/icon.icns
  # Ad hoc ("-"), not unsigned: macOS delivers no notifications from an app
  # without a valid signature (FE-70). INF-08: with LANEWORK_MAC_IDENTITY set
  # (mise.local.toml), scripts/electron-builder.mjs replaces it with that
  # Developer ID and the developer-id entitlements, and `dist` notarizes.
  identity: "-"
  category: public.app-category.productivity
  # INF-11: the DMG is what people download; the zip is what Squirrel.Mac
  # installs an update from, and latest-mac.yml describes it. Both from the
  # same signed, notarized and stapled app. Apple silicon only.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  # INF-05 (SW-05): the ad hoc build's entitlements; a Developer ID build
  # swaps in build/entitlements.mac.developer-id*.plist (INF-08). Explicit
  # entitlements rather than electron-builder's
  # default, which also grants allow-unsigned-executable-memory. The inherit
  # plist covers the Electron helpers and the dictation helper's microphone.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # FE-69: the dictation helper opens the microphone and runs Apple's speech
  # recognition; macOS asks in Lanework's name and needs these strings to.
  extendInfo:
    NSMicrophoneUsageDescription: Lanework listens while you dictate a message to Claude or Codex.
    NSSpeechRecognitionUsageDescription: Lanework turns what you dictate into text, on this Mac.
win:
  target: nsis
linux:
  target: AppImage
