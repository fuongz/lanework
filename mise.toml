# Tasks for this repo: `mise tasks` lists them, `mise run <name>` runs one.
# Each is a thin name over a package.json script, so the scripts stay the one
# definition of how things are built and checked.

[tasks.dev]
description = "Desktop app in dev: renderer HMR, main/preload restart; its own data in ~/.lanew-dev (LANEWORK_HOME=~/.lanew for the real data)"
run = "bun run dev"

[tasks."dev:updater"]
description = "Dev run against a pretend update feed: LANEWORK_UPDATER_SIMULATE=available|none|error|download-error (default available)"
run = "LANEWORK_UPDATER_SIMULATE=${LANEWORK_UPDATER_SIMULATE:-available} bun run dev"

[tasks.build]
description = "Build the desktop app bundle (dist/)"
run = "bun run build"

[tasks."app:package"]
description = "Build the Preview app, \"Lanework (Preview).app\", unpacked, into apps/desktop/release/mac-arm64"
run = "bun run package"

[tasks."app:dmg"]
description = "Build the macOS installer, apps/desktop/release/Lanework-<version>-arm64.dmg"
dir = "apps/desktop"
# Ad hoc signed unless mise.local.toml (gitignored) sets LANEWORK_MAC_IDENTITY
# (Developer ID, "Name (TEAMID)") and LANEWORK_NOTARY_PROFILE (a
# `xcrun notarytool store-credentials` profile): then it is signed, notarized
# and stapled. app:package and app:install sign with the same identity but
# never notarize. The logic lives in apps/desktop/scripts/electron-builder.mjs.
run = "bun run dist -- --mac"

[tasks."app:install"]
description = "Build Lanework (Preview).app and replace the copy in /Applications (the release Lanework.app is never touched)"
depends = ["app:package"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
app="apps/desktop/release/mac-arm64/Lanework (Preview).app"
dest="/Applications/Lanework (Preview).app"
[ -d "$app" ] || { echo "No $app — the package step did not produce it." >&2; exit 1; }
# Quit a running Preview first: replacing an app that is open leaves the old
# build running, which looks exactly like the update did nothing. Only the
# Preview: a release Lanework that is open keeps running.
osascript -e 'tell application "Lanework (Preview)" to quit' >/dev/null 2>&1 || true
rm -rf "$dest"
cp -R "$app" /Applications/
version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$dest/Contents/Info.plist")"
echo "Installed $dest ($version)"
'''

[tasks."release:bump"]
description = "Next release version: package.json + commit + tag vX.Y.Z (no push). mise run release:bump patch"
# INF-10, docs/agents/versioning.md. Dev builds (app:package, app:install)
# never touch package.json; only this does.
dir = "apps/desktop"
usage = 'arg "<part>" help="patch, minor or major"'
run = "node scripts/release-bump.mjs ${usage_part?}"

[tasks.typecheck]
description = "Typecheck every package"
run = "bun run typecheck"

[tasks.lint]
description = "Biome and the layout audit"
run = "bun run lint"

[tasks.gate]
description = "Everything that must pass before a commit: builds, lint, typecheck"
run = "bun run gate"

[tasks.test]
description = "Build, then the desktop Playwright suite (production build)"
# The specs boot dist/: without a build they test the last bundle.
depends = ["build"]
run = "bun run test"

[tasks."test:agents"]
description = "Build, then the agent view's cases: header facts, Changes, background tasks, agent marks"
dir = "apps/desktop"
run = [
    "bun run build",
    "bunx playwright test tests/terminal.spec.ts tests/repo.spec.ts tests/agent-sessions.spec.ts --project=production -g \"FE-38: an agent's view|FE-39: Changes marks the one file|FE-41|FE-42|carries its spinner|on another machine marks\"",
]

[tasks."test:grep"]
description = "Build, then only the cases whose name matches: mise run test:grep \"FE-42\""
dir = "apps/desktop"
usage = 'arg "<pattern>" help="Part of a test name, or a regex"'
run = [
    "bun run build",
    "bunx playwright test --project=production -g \"${usage_pattern?}\"",
]

[tasks."test:packaged"]
description = "Playwright against the packaged app"
run = "bun run test:packaged"
